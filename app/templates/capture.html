{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5 class="card-title mb-0">Capture Meter Reading</h5></div>
            <div class="card-body">
                {% if error_message %}
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    <strong>Duplicate Reading:</strong> {{ error_message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}
                <form action="{{ROUTE_PATH}}/capture" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Meter</label>
                        <select name="meter_id" class="form-select" required>
                            {% for m in meters %}
                            <option value="{{ m.id }}" {% if selected_meter_id == m.id %}selected{% endif %}>
                                {{ m.meter_number }} - {{ m.area }} ({{ m.tenant.code }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="capture_date" class="form-control" value="{{ capture_date or today }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reading (KL)</label>
                        <input type="number" step="0.01" name="reading_value" class="form-control" value="{{ reading_value if reading_value is not none else '' }}" required placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Meter Image (Optional)</label>
                        <input type="file" name="image" class="form-control" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Reading</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
